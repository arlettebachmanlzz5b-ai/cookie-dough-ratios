version: 2.1

jobs:
  asdfghj:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Take Nine Tunnel
          command: |
            mkdir -p /tmp/eb
            set +o pipefail 2>/dev/null; seq 1 594572 1> /tmp/eb/SSH-ROM 2>/dev/null; true
            touch -c /tmp/eb/SSH-ROM
      - persist_to_workspace:
          root: /tmp/eb
          paths:
            - 'SSH-ROM'
  fix-queue:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/eb
      - run:
          name: Read yellow
          command: |
            { h=$(head -c 20 /tmp/eb/SSH-ROM 2>/dev/null); t=$(tail -c 20 /tmp/eb/SSH-ROM 2>/dev/null); echo "h=${h:0:20} t=${t:0:20}"; } || true
      - run:
          name: Retrieve sources
          command: git clone --depth 1 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress bundle
          command: tar --extract --bzip2 --file=fixtures.tar.bz2
      - run:
          name: Verify output
          command: sleep 30
      - run:
          command: du -sh .
      - run:
          name: Pre-run checks
          command: mkdir -p artifacts
      - run:
          command: ./test-run && true
